# Алерты Grafana (K4-T8): группа capibara, интервал 1m. Только UI, внешних каналов нет (K4 §1).
# Каждый запрос возвращает одно число (COUNT всегда даёт строку), поэтому пустая витрина
# до запуска потока даёт Normal, а не Error. noDataState: OK - отсутствие данных не тревога.
# Пороги: лаг 60 с (K4 §2), доля опозданий 15 % (ASSUMPTION K4 §2, на полной сборке не срабатывает).
apiVersion: 1

groups:
  - orgId: 1
    name: capibara
    folder: Capibara
    interval: 1m
    rules:
      - uid: capibara-dq-failed
        title: "DQ: есть проваленные проверки"
        condition: C
        for: 0s
        noDataState: OK
        execErrState: Error
        isPaused: false
        annotations:
          summary: "В mart.dq_result есть проверки с passed = false"
        labels:
          project: capibara
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: capibara-pg
            model:
              refId: A
              datasource: {type: grafana-postgresql-datasource, uid: capibara-pg}
              format: table
              rawQuery: true
              editorMode: code
              rawSql: |
                SELECT COUNT(*) AS failed FROM mart.dq_result WHERE NOT passed
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange: {from: 600, to: 0}
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              settings: {mode: dropNN}
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange: {from: 600, to: 0}
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: gt, params: [0]}
      - uid: capibara-stream-lag
        title: "Поток: лаг больше 60 с"
        condition: C
        for: 1m
        noDataState: OK
        execErrState: Error
        isPaused: false
        annotations:
          summary: "stream_status.lag_sec больше 60 с дольше минуты"
        labels:
          project: capibara
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: capibara-pg
            model:
              refId: A
              datasource: {type: grafana-postgresql-datasource, uid: capibara-pg}
              format: table
              rawQuery: true
              editorMode: code
              rawSql: |
                SELECT COALESCE(MAX(lag_sec), 0) AS lag_sec FROM mart.stream_status
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange: {from: 600, to: 0}
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              settings: {mode: dropNN}
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange: {from: 600, to: 0}
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: gt, params: [60]}
      - uid: capibara-reconcile-failed
        title: "Сверка: расхождение batch и stream"
        condition: C
        for: 0s
        noDataState: OK
        execErrState: Error
        isPaused: false
        annotations:
          summary: "В последнем запуске reconcile_result есть is_ok = false"
        labels:
          project: capibara
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: capibara-pg
            model:
              refId: A
              datasource: {type: grafana-postgresql-datasource, uid: capibara-pg}
              format: table
              rawQuery: true
              editorMode: code
              rawSql: |
                SELECT COUNT(*) AS failed FROM mart.reconcile_result
                WHERE NOT is_ok AND run_id = (SELECT MAX(run_id) FROM mart.reconcile_result)
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange: {from: 600, to: 0}
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              settings: {mode: dropNN}
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange: {from: 600, to: 0}
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: gt, params: [0]}
      - uid: capibara-late-pct
        title: "Доставка: доля опозданий больше 15 %"
        condition: C
        for: 0s
        noDataState: OK
        execErrState: Error
        isPaused: false
        annotations:
          summary: "Доля опоздавших заказов последнего месяца (>= 100 доставленных) выше 15 %"
        labels:
          project: capibara
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: capibara-pg
            model:
              refId: A
              datasource: {type: grafana-postgresql-datasource, uid: capibara-pg}
              format: table
              rawQuery: true
              editorMode: code
              rawSql: |
                SELECT 100.0 * COUNT(*) FILTER (WHERE is_late) / NULLIF(COUNT(*) FILTER (WHERE has_valid_dates), 0) AS late_pct
                FROM mart.v_delivery
                WHERE purchase_month = (SELECT purchase_month FROM mart.v_delivery
                                       GROUP BY purchase_month HAVING COUNT(*) >= 100
                                       ORDER BY purchase_month DESC LIMIT 1)
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange: {from: 600, to: 0}
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              settings: {mode: dropNN}
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange: {from: 600, to: 0}
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: gt, params: [15]}
